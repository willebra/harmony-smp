name: Double Open Compliance Scan

on:
  workflow_dispatch:

jobs:
  compliance-run:
    runs-on: ubuntu-latest
    steps:
      # 0. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 1. Install the ORT Server Client (OSC) and Authenticate
      - name: Setup Double Open CLI
        uses: eclipse-apoapsis/actions/setup-osc@main
        with:
          url: https://ort-api.scw.doubleopen.io
          client-id: ${{ vars.OSC_CLIENT_ID }}
          username: ${{ vars.OSC_USERNAME }}
          password: ${{ secrets.OSC_PASSWORD }}

      # 2. Trigger the Scan
      - name: Start ORT Run
        run: |
          osc runs start --parameters-file=./.github/workflows/ort-run-config.json 
        env:
          OSC_REPOSITORY_ID: 335  # <--- REPLACE WITH YOUR REPO ID
          OSC_RUNS_START_WAIT: true # This makes the action wait for results

      # 3. Download the Reports
      - name: Download Reports
        run: |
          osc runs download reports
        env:
          # Define the specific reports you want to download
          OSC_DOWNLOAD_REPORTS_FILE_NAMES: 'scan-report-web-app.html,scan-report-cyclonedx.json'
          OSC_DOWNLOAD_REPORTS_OUTPUT_DIR: './reports'

      # 4. Upload Reports to GitHub Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: reports/
